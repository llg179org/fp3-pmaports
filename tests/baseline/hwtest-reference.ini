; hwtest reference for the Fairphone 3, exported on 2026-08-13 with exactly the
; skips 15-hwtest passes to --verify. Both halves have to match: --verify exits
; 1 when an option in this file produces no result on the run, so a component
; skipped on only one side reads as a regression rather than as a silence.
;
; Why each component is skipped, since between them they are most of hwtest:
;
;   Camera                    it asks for a 320x240 and a 640x480 JPEG and gets
;                             neither, on a sensor that captures 4032x3024 on
;                             demand. 40-camera, 41-camera-focus, 42-camera-flash
;   Audio, Vibrator           their probes drive the loudspeaker and the motor.
;                             Audible things are opt-in everywhere else in this
;                             suite. 20-audio..23-audio-slimbus, and 16-vibrator
;   the seven IIO components  ☠️ hwtest's --export CRASHES on them, on this
;   and Led                   device: it writes each result's path as a
;                             comment-shaped key, and Python 3.14's configparser
;                             refuses a key containing the delimiter. Every IIO
;                             path has one (`iio:device2`), and so does the LED
;                             (`rgb:status`), so the export dies with
;                             InvalidWriteError partway through the file.
;                             25-sensor covers the sensors properly; the LED is
;                             an open item in docs/TODO.md
;
; What is left is what hwtest is genuinely good at and nothing else here covers:
; the framebuffer, the DRM connector, and every input device - touchscreen,
; power key, volume keys and the headset jack's own input node.
;
; Regenerate with the same flags, from a state you consider good:
;   hwtest --skip Camera --skip Audio --skip Vibrator --skip Magnetometer \
;          --skip Accelerometer --skip Gyroscope --skip Temperature \
;          --skip Proximity --skip Illuminance --skip Pressure --skip Led \
;          --export tests/baseline/hwtest-reference.ini
; then edit it so components that SHOULD work read True even if they are broken
; today, or the breakage becomes the baseline and stops being reported.

[hwtest]
export-version = 1
interactive = no
skipped = Camera,Magnetometer,Accelerometer,Gyroscope,Temperature,Proximity,Illuminance,Pressure,Vibrator,Audio,Led

[framebuffer]
; /sys/class/graphics/fb0
msmdrmfb = True

[drm]
; /sys/class/drm/card0-dsi-1
- = True

[input]
; /dev/input/event6
fairphone 3 headset jack = True
; /dev/input/event5
; /dev/input/event4
himax touchscreen = True
; /dev/input/event2
pm8941_resin = True
; /dev/input/event1
pm8941_pwrkey = True
; /dev/input/event0
gpio-keys = True
